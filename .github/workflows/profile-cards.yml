name: Profil kartlarını güncelle

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats kartı
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=grkmefedrsn34&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: En çok kullanılan diller
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=grkmefedrsn34&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Katkı yılanı
        uses: Platane/snk@v3
        with:
          github_user_name: grkmefedrsn34
          outputs: |
            profile/snake.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --cached --quiet || git commit -m "Profil kartlarını güncelle"
          git push
